<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-qGHek1Z32hi4cBHXt3/fHMVzQnFqhuRozuBQwFTG47c='; base-uri 'none'; form-action 'none'">
<title>Connecting… · Local Business OS</title>
<style>body{font:16px/1.6 system-ui,sans-serif;max-width:560px;margin:60px auto;padding:0 16px;color:#1d1d1b;background:#fbfaf7}#continue{display:inline-block;margin-top:8px;padding:12px 20px;border-radius:8px;background:#1d1d1b;color:#fff;text-decoration:none;font-weight:600}.muted{color:#6b6a65;font-size:14px}</style></head><body>
<h1>Finishing the connection…</h1>
<p id="msg">Returning you to the Local Business OS console on this computer…</p>
<div id="fallback" hidden><p><a id="continue">Continue to Local Business OS</a></p><p class="muted">Opens the Local Business OS console on this computer (localhost). Nothing to copy or type.</p></div>
<noscript><p>JavaScript is needed to finish the connection. Please enable it and start again from the console.</p></noscript>
<script>(function () {
  "use strict";
  // G3-F7 relay: transport only. Fixed destination, no client/business logic.
  var TARGET = "http://localhost:3000/api/meta/oauth/callback";
  var FALLBACK_DELAY_MS = 25000; // console page can take ~10-18s to render after the callback; avoid a premature second click
  var FIELDS = ["code", "state", "error", "error_reason", "error_description", "error_code", "error_message"];
  var MAX = { code: 4096, state: 4096 };
  var MAX_OTHER = 1024;

  var msg = document.getElementById("msg");
  var box = document.getElementById("fallback");
  var link = document.getElementById("continue");
  function say(t) { msg.textContent = t; }
  // Diagnostics: parameter NAMES only (never values), so a failed hand-off can be explained later.
  function names() {
    var seen = [];
    [location.search.replace(/^\?/, ""), location.hash.replace(/^#/, "")].forEach(function (s, i) {
      new URLSearchParams(s).forEach(function (_, k) { if (/^[a-z_]{1,32}$/.test(k)) seen.push((i ? "#" : "?") + k); });
    });
    return seen.length ? seen.join(", ") : "none";
  }
  function stop(t) {
    var n = names();
    try { history.replaceState(null, "", location.pathname); } catch (e) {}
    say(t + " Please start the connection again from the Local Business OS console. (Received: " + n + ")");
  }

  // Meta normally returns the code flow in the query string; accept the fragment too
  // (ignoring the "#_=_" marker Meta appends) so a fragment response is not silently lost.
  var q = new URLSearchParams(location.search);
  var h = new URLSearchParams(location.hash.replace(/^#/, ""));
  h.delete("_");
  var has = function (p) { return FIELDS.some(function (k) { return p.has(k); }); };
  var src = has(q) ? q : h;

  if (q.has("access_token") || h.has("access_token")) { stop("An access token was returned in the browser address, which this connection never accepts."); return; }
  if (!has(src)) { stop("Missing authorization data."); return; }

  var out = new URLSearchParams();
  for (var i = 0; i < FIELDS.length; i++) {
    var k = FIELDS[i], all = src.getAll(k);
    if (all.length > 1) { stop("Authorization data was duplicated."); return; }
    if (all.length === 1) {
      var v = all[0];
      if (v === "" || v.length > (MAX[k] || MAX_OTHER) || /[\u0000-\u001f\u007f]/.test(v)) { stop("Authorization data was malformed."); return; }
      out.set(k, v);
    }
  }
  var code = out.has("code"), err = out.has("error"), state = out.has("state");
  if (code && err) { stop("Authorization data was ambiguous."); return; }
  if (code && !state) { stop("Authorization data is missing its security check (state)."); return; }
  if (!code && !err) { stop("Missing authorization code."); return; }

  // Destination is a constant; only whitelisted fields are appended, re-encoded by URLSearchParams.
  var dest = TARGET + "?" + out.toString();

  // Keep code/state out of the address bar and history (and out of Referer: meta referrer=no-referrer).
  try { history.replaceState(null, "", location.pathname); } catch (e) {}

  link.href = dest;
  link.addEventListener("click", function () {
    link.setAttribute("aria-disabled", "true");
    link.style.pointerEvents = "none";
    link.textContent = "Opening Local Business OS…";
  });
  var soft = setTimeout(function () { say("Still connecting… this can take up to 20 seconds. Please keep this tab open."); }, 4000);
  var timer = setTimeout(function () { box.hidden = false; say("Still here? Your browser may have blocked the automatic return."); }, FALLBACK_DELAY_MS);
  // Returning to this page via Back (bfcache) must not offer a second submission of the same code.
  window.addEventListener("pagehide", function () { clearTimeout(timer); clearTimeout(soft); });
  window.addEventListener("pageshow", function (e) {
    if (!e.persisted) return;
    clearTimeout(timer); clearTimeout(soft); box.hidden = true; link.removeAttribute("href");
    say("This authorization was already sent. If the connection did not finish, start again from the console.");
  });

  say(err ? "Meta reported a problem. Returning you to the Local Business OS console…" : "Returning you to the Local Business OS console on this computer…");
  location.replace(dest);
})();</script>
</body></html>
